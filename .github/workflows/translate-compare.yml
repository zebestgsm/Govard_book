name: Compare translation models (OPUS vs NLLB vs LLM)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Развороты через запятую (пусто — все 165; для теста 31,87,141,95)'
        required: false
        default: '31,87,141,95'
      llm_model:
        description: 'LLM для GitHub Models (пример: openai/gpt-4o-mini, meta/Meta-Llama-3.1-8B-Instruct)'
        required: false
        default: 'openai/gpt-4o-mini'
      apply_glossary:
        description: 'Применить глоссарий post_replace после перевода (true/false)'
        required: false
        default: 'true'

permissions:
  contents: read
  issues: write
  models: read

jobs:
  # 1) OPUS-MT baseline
  opus:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.57.1" sentencepiece sacremoses
      - name: Build document
        run: python tools/build_translation_doc.py 2>&1 | tee build.log
      - name: Translate OPUS
        env:
          MT_MODEL: Helsinki-NLP/opus-mt-en-ru
          LIMIT: ${{ github.event.inputs.limit }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tools/translate_opus.py 2>&1 | tee translate.log
      - name: Apply glossary post_replace
        if: ${{ github.event.inputs.apply_glossary == 'true' }}
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: python tools/apply_glossary.py 2>&1 | tee glossary.log || true
      - name: Report
        if: always()
        run: python tools/mt_report.py 2>&1 | tee report.log || true
      - name: Post to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, pathlib
          body = '# OPUS Helsinki-NLP/opus-mt-en-ru\n\n'
          for name in ('translate.log','glossary.log','report.log'):
              try:
                  body += f'\n=== {name} ===\n' + open(name, encoding='utf-8', errors='replace').read()[-8000:]
              except: body += f'\n=== {name} === не создан\n'
          # черновик для 4 разворотов — в комментарий (до 40к)
          try:
              import os
              p = pathlib.Path('translation_sources/ru-mt.json')
              if p.exists() and p.stat().st_size < 40000:
                  body += '\n=== черновик opus (ru-mt.json) ===\n' + p.read_text(encoding='utf-8')
          except: pass
          req = urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/issues/2/comments',
              data=json.dumps({'body': body[:55000]}).encode(),
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          )
          try: print(urllib.request.urlopen(req).status)
          except Exception as e: print('comment failed', e)
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mt-draft-opus
          path: |
            translation_sources/ru-mt.json
            translation_sources/ru-mt-stats.json
            translate.log
            glossary.log
            report.log
          retention-days: 14

  # 2) NLLB-200
  nllb:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.57.1" sentencepiece sacremoses
      - name: Build document
        run: python tools/build_translation_doc.py 2>&1 | tee build.log
      - name: Translate NLLB
        env:
          MT_MODEL: facebook/nllb-200-distilled-600M
          LIMIT: ${{ github.event.inputs.limit }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tools/translate_nllb.py 2>&1 | tee translate.log
      - name: Apply glossary
        if: ${{ github.event.inputs.apply_glossary == 'true' }}
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: python tools/apply_glossary.py 2>&1 | tee glossary.log || true
      - name: Report
        if: always()
        run: python tools/mt_report.py 2>&1 | tee report.log || true
      - name: Post to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, pathlib
          body = '# NLLB facebook/nllb-200-distilled-600M\n\n'
          for name in ('translate.log','glossary.log','report.log'):
              try: body += f'\n=== {name} ===\n' + open(name, encoding='utf-8', errors='replace').read()[-8000:]
              except: body += f'\n=== {name} === не создан\n'
          try:
              p = pathlib.Path('translation_sources/ru-mt.json')
              if p.exists() and p.stat().st_size < 40000:
                  body += '\n=== черновик nllb (ru-mt.json) ===\n' + p.read_text(encoding='utf-8')
          except: pass
          req = urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/issues/2/comments', data=json.dumps({'body': body[:55000]}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          try: print(urllib.request.urlopen(req).status)
          except Exception as e: print('comment failed', e)
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mt-draft-nllb
          path: |
            translation_sources/ru-mt.json
            translation_sources/ru-mt-stats.json
            translate.log
            glossary.log
            report.log
          retention-days: 14

  # 3) LLM via GitHub Models
  llm:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build document
        run: python tools/build_translation_doc.py 2>&1 | tee build.log
      - name: Translate via GitHub Models
        env:
          GH_MODEL: ${{ github.event.inputs.llm_model }}
          LIMIT: ${{ github.event.inputs.limit }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/translate_github_models.py 2>&1 | tee translate.log
      - name: Apply glossary
        if: ${{ github.event.inputs.apply_glossary == 'true' }}
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: python tools/apply_glossary.py 2>&1 | tee glossary.log || true
      - name: Report
        if: always()
        run: python tools/mt_report.py 2>&1 | tee report.log || true
      - name: Post to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, pathlib
          body = f'# LLM {os.environ.get("GH_MODEL","")} via GitHub Models\n\n'
          for name in ('translate.log','glossary.log','report.log'):
              try: body += f'\n=== {name} ===\n' + open(name, encoding='utf-8', errors='replace').read()[-8000:]
              except: body += f'\n=== {name} === не создан\n'
          try:
              p = pathlib.Path('translation_sources/ru-mt.json')
              if p.exists() and p.stat().st_size < 40000:
                  body += '\n=== черновик llm (ru-mt.json) ===\n' + p.read_text(encoding='utf-8')
          except: pass
          req = urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/issues/2/comments', data=json.dumps({'body': body[:55000]}).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          try: print(urllib.request.urlopen(req).status)
          except Exception as e: print('comment failed', e)
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mt-draft-llm
          path: |
            translation_sources/ru-mt.json
            translation_sources/ru-mt-stats.json
            translate.log
            glossary.log
            report.log
          retention-days: 14
