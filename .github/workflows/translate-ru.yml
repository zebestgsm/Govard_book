name: Build Russian translation draft
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Модель перевода (по умолчанию базовая OPUS-MT)'
        required: false
        default: 'Helsinki-NLP/opus-mt-en-ru'
      limit:
        description: 'Только эти развороты, через запятую (пусто — все 165)'
        required: false
        default: ''
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install translation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.57.1" sentencepiece sacremoses
      - name: Build translation document from verified English
        run: |
          set -o pipefail
          python tools/build_translation_doc.py 2>&1 | tee build.log
      - name: Translate
        env:
          MT_MODEL: ${{ github.event.inputs.model || 'Helsinki-NLP/opus-mt-en-ru' }}
          LIMIT: ${{ github.event.inputs.limit }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          python tools/translate_opus.py 2>&1 | tee translate.log
      - name: Check the draft against the source
        run: |
          set -o pipefail
          python tools/mt_report.py 2>&1 | tee report.log
      - name: Commit the draft and the report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translation_sources/work-doc.json translation_sources/ru-mt.json \
                  translation_sources/ru-mt-stats.json mt-report.md || true
          git commit -m "MT draft: ${{ github.event.inputs.model }} (${{ github.event.inputs.limit || 'all' }})" || true
          git push origin HEAD:${{ github.ref_name }} || true
      - name: Post log to the diagnostics issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body = ''
          for name in ('translate.log', 'report.log'):
              try:
                  body += '\n=== ' + name + ' ===\n' + open(name, encoding='utf-8', errors='replace').read()[-12000:]
              except FileNotFoundError:
                  body += '\n=== ' + name + ' === не создан\n'
          req = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/issues/2/comments',
              data=json.dumps({'body': 'CI translation log:\n```' + body[:55000] + '\n```'}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json'})
          try:
              print(urllib.request.urlopen(req).status)
          except Exception as error:
              print('comment failed', error)
          PY
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt-draft
          path: |
            translation_sources/ru-mt.json
            translation_sources/ru-mt-stats.json
            translate.log
            report.log
          retention-days: 14
