name: Build Russian translation draft
on:
  workflow_dispatch:
  push:
    branches: [arena/2bdaeaa2-govard-book]
    paths:
      - 'translation_sources/clean-source.json'
      - 'tools/translate_opus.py'
      - '.github/workflows/translate-ru.yml'
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install translation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers sentencepiece sacremoses
      - name: Translate recovered source
        run: python tools/translate_opus.py
      - name: Upload translation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ru-opus-translation
          path: |
            translation_sources/ru-opus.json
            translation_sources/ru-opus-stats.json
          retention-days: 14
